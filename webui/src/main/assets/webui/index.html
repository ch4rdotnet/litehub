<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>litehub</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>litehub</h1>
  <nav>
    <button data-tab="layout" class="on">layout</button>
    <button data-tab="json">json</button>
    <button data-tab="themes">themes</button>
    <button data-tab="settings">settings</button>
    <a href="/status" target="_blank">status</a>
  </nav>
</header>

<section id="login" hidden>
  <h2>enter the hub's pin</h2>
  <form id="login-form"><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button>open</button></form>
  <p id="login-error" class="error"></p>
</section>

<main id="app" hidden>
  <section id="tab-layout" class="tab">
    <div class="bar">
      <label>dashboard <select id="dashboard"></select></label>
      <button id="dash-new">new</button>
      <button id="dash-copy">duplicate</button>
      <button id="dash-delete">delete</button>
      <button id="dash-active">show this one on the hub</button>
    </div>
    <div class="bar">
      <button id="page-prev">prev</button>
      <span id="page-label"></span>
      <button id="page-next">next</button>
      <button id="page-add">add page</button>
      <button id="page-remove">remove page</button>
      <span class="grow"></span>
      <label>grid <input id="grid-columns" class="tiny" type="number" min="1" max="24"> by <input id="grid-rows" class="tiny" type="number" min="1" max="24"></label>
      <label class="toggle"><input id="grid-keep" type="checkbox" checked>keep tile sizes</label>
      <select id="grid-density"><option value="comfortable">comfortable</option><option value="compact">compact</option></select>
    </div>
    <div class="split">
      <div>
        <div id="grid" class="grid"></div>
        <div class="bar">
          <button id="add" class="primary">add widget</button>
          <button id="undo">undo</button>
          <button id="redo">redo</button>
          <span class="grow"></span>
          <span id="dirty" class="muted"></span>
          <button id="save" class="primary">save to hub</button>
        </div>
        <p id="message"></p>
        <p class="muted hint">drag a tile to move it, its corner to resize it, tiles in the way move aside. arrow keys nudge the picked tile (shift resizes), delete removes it, ctrl z undoes</p>
      </div>
      <aside>
        <form id="settings"><p class="muted">pick a widget to change it</p></form>
        <h2>on the hub now</h2>
        <img id="preview" alt="the hub's screen">
      </aside>
    </div>
  </section>

  <section id="tab-json" class="tab" hidden>
    <div class="bar">
      <button id="json-apply" class="primary">save to hub</button>
      <button id="export">export</button>
      <label class="file">import <input id="import" type="file" accept="application/json,.json"></label>
    </div>
    <textarea id="json" spellcheck="false"></textarea>
    <p id="json-message"></p>
  </section>

  <section id="tab-themes" class="tab" hidden>
    <h2>dashboard theme</h2>
    <div class="bar">
      <label>dashboard <select id="theme-dashboard"></select></label>
      <label>use <select id="theme-mode">
        <option value="system">light or dark, following the system</option>
        <option value="light">always the light theme</option>
        <option value="dark">always the dark theme</option>
      </select></label>
      <label>light <select id="theme-light"></select></label>
      <label>dark <select id="theme-dark"></select></label>
    </div>
    <div class="settings">
      <div>
        <div id="theme-list" class="sections"></div>
        <div class="bar"><button id="theme-new">new theme</button></div>
      </div>
      <div>
        <div id="theme-editor"></div>
        <div class="bar">
          <button id="themes-save" class="primary">save to hub</button>
          <span id="themes-dirty" class="muted"></span>
        </div>
        <p id="themes-message"></p>
      </div>
    </div>
  </section>

  <section id="tab-settings" class="tab" hidden>
    <div class="settings">
      <div id="settings-sections" class="sections"></div>
      <div>
        <form id="settings-form"></form>
        <div class="bar">
          <button id="settings-save" class="primary">save to hub</button>
          <button id="settings-cancel">cancel</button>
        </div>
        <p id="settings-message"></p>
      </div>
    </div>
  </section>
</main>

<dialog id="picker">
  <div class="bar">
    <h2>add a widget</h2>
    <span class="grow"></span>
    <input id="picker-search" placeholder="search" autocomplete="off">
    <button id="picker-close">close</button>
  </div>
  <div id="picker-list" class="picker-list"></div>
  <p id="picker-message"></p>
</dialog>
<script src="/app.js"></script>
</body>
</html>
