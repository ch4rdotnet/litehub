# builds a signed release apk when a v* tag is pushed and attaches it to a github release.
# signing secrets live in the protected "release" environment, only reach steps through env,
# and the keystore only ever exists in the runner's temp dir, outside the workspace
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the token isn't left in .git/config for the build to find
          persist-credentials: false

      - name: Set up java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # gradle's daemon toolchain is pinned to 21 (gradle/gradle-daemon-jvm.properties)
          java-version: "21"

      # v1.2.3 becomes the app's version 1.2.3, anything that isn't a version stops here
      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            printf 'tag %s is not a version like v1.2.3\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'VERSION_NAME=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/litehub-$GITHUB_REF_NAME.apk"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a dash (v1.3.0-beta.1) is a pre-release, hubs on stable never see it
        run: |
          prerelease=""
          case "$VERSION_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/litehub-$GITHUB_REF_NAME.apk" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
